name: Build Kwrt for Cudy TR3600 v1

# Builds a firmware image with the Kwrt (openwrt.ai) toolchain, then applies
# this repository's overlay on top of it:
#
#   overlay/devices/mediatek_filogic/patches/zz-tr3600-fixes.patch
#       fix the PWM fan channel (PWM1 -> PWM0) and the thermal ramp
#   overlay/devices/mediatek_filogic/.config
#       build only cudy_tr3600-v1, add the usbnet kernel modules
#   files/uci-defaults/99-tr3600-defaults
#   files/hotplug.d/net/25-tr3600-usb-tether
#       board defaults and the USB netdev hook, installed into the target
#       base-files tree (NOT via Kwrt's devices/*/diy/ - see README)
#
# The upstream build system is cloned at run time and is NOT vendored here.

on:
  workflow_dispatch:
    inputs:
      kwrt_ref:
        description: "kiddin9/Kwrt git ref to build from"
        required: true
        default: "25.12"
      openwrt_ref:
        description: "openwrt/openwrt branch to build from"
        required: true
        default: "openwrt-25.12"
      kwrt_action:
        description: 'Kwrt "action" string, e.g. "nocache" to skip the build cache'
        required: false
        default: ""
      upload_imagebuilder:
        description: "Also upload the imagebuilder / initramfs (large)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "files/**"
      - ".github/workflows/build.yml"

env:
  TZ: Asia/Shanghai
  TARGET: mediatek_filogic
  KRT_REF: ${{ github.event.inputs.kwrt_ref || '25.12' }}
  OWRT_REF: ${{ github.event.inputs.openwrt_ref || 'openwrt-25.12' }}
  KRT_ACTION: ${{ github.event.inputs.kwrt_action || '' }}
  UPLOAD_IB: ${{ github.event.inputs.upload_imagebuilder || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ github.event.inputs.kwrt_ref || '25.12' }} / cudy_tr3600-v1
    timeout-minutes: 350

    steps:
      - name: Checkout this repository (overlay)
        uses: actions/checkout@main
        with:
          path: overlay-src

      - name: Free disk space
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Clone Kwrt build system
        run: |
          set -x
          git clone --depth 1 -b "${KRT_REF}" https://github.com/kiddin9/Kwrt kwrt
          cd kwrt
          echo "Kwrt HEAD: $(git rev-parse HEAD)"

      - name: Apply our overlay
        run: |
          set -x
          cp -rf overlay-src/overlay/devices/. kwrt/devices/
          echo "--- overlay files now in the Kwrt tree ---"
          find kwrt/devices/mediatek_filogic -type f | sort
          echo "--- tr3600 patches that will be applied, in sort order ---"
          find kwrt/devices/mediatek_filogic/patches -maxdepth 1 -type f -name '*.patch' | sort

      - name: Load Settings.ini
        working-directory: kwrt
        run: |
          source "${GITHUB_WORKSPACE}/kwrt/devices/common/settings.ini"
          if [ -f "devices/${TARGET}/settings.ini" ]; then
            source "${GITHUB_WORKSPACE}/kwrt/devices/${TARGET}/settings.ini"
          fi
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
          echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
          # Kwrt's diy.sh reads $REPO_TOKEN for a GitHub API poll; with no token
          # the request 401s, the poll loop is skipped and the build proceeds.
          sed -i "1a REPO_TOKEN=${{ secrets.KWRT_TOKEN }}" devices/common/diy.sh
          sed -i "1a TARGET=${TARGET}" devices/common/diy.sh

      - name: Clone source code
        working-directory: kwrt
        run: |
          set -x
          git clone -b "${OWRT_REF}" --depth 1 https://github.com/openwrt/openwrt openwrt
          cd openwrt
          echo "openwrt HEAD: $(git rev-parse HEAD)"

      - name: Free up disk space
        working-directory: kwrt
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir openwrt/staging_dir
          ln -sf /mnt/openwrt/build_dir openwrt/build_dir
          sudo ln -sf openwrt/staging_dir /mnt/openwrt/staging_dir

      - name: Load custom configuration
        working-directory: kwrt
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
              git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
            else
              git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
              cd "$tmpdir"
              git checkout $branch
            fi
            if [ "$?" != 0 ]; then
              echo "error on $rurl"
              exit 1
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
          }
          export -f git_clone_path
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf devices/${TARGET}/. openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/$DIY_SH
          /bin/bash "devices/common/$DIY_SH"
          cp -f devices/common/$CONFIG_FILE .config
          if [ -f "devices/${TARGET}/$CONFIG_FILE" ]; then
            echo >> .config
            cat devices/${TARGET}/$CONFIG_FILE >> .config
          fi
          if [ -f "devices/${TARGET}/$DIY_SH" ]; then
            chmod +x devices/${TARGET}/$DIY_SH
            /bin/bash "devices/${TARGET}/$DIY_SH"
          fi
          cp -Rf ./diy/* ./ || true

      - name: Apply patches
        working-directory: kwrt/openwrt
        run: |
          # Kwrt keeps its SHARED patch set in devices/common/patches and merges
          # it into the per-target patch directory with `cp -rn` (no-clobber),
          # then applies everything it finds there in `sort -z` order.
          #
          # Copying from devices/${TARGET}/patches instead of devices/common/patches
          # silently skips the entire shared set.  That is what killed the first
          # build: without common/patches/kernel-defaults.patch the kernel never
          # gets its `olddefconfig` pass, so a cold (uncached) build dies in
          # kconfig with "Restart config ... (IR_IMON_DECODER) [N/m/?] (NEW)".
          cp -rn devices/common/patches devices/${TARGET}/
          echo "=== patch files that will be applied ==="
          ls -1 devices/${TARGET}/patches/
          if [ -n "$(ls -A devices/${TARGET}/*.bin.patch 2>/dev/null)" ]; then
            git apply devices/${TARGET}/patches/*.bin.patch
          fi
          find "devices/${TARGET}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'"
          find "devices/${TARGET}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"
          echo "=== verify the shared patch set landed ==="
          grep -n 'olddefconfig' include/kernel-defaults.mk || {
            echo "FATAL: devices/common/patches were not applied - refusing to build"; exit 1; }
          echo "=== verify our DTS fix landed ==="
          f=target/linux/mediatek/dts/mt7987b-cudy-tr3600-v1.dts
          grep -n 'pwms = <&pwm' $f
          grep -n 'pinctrl-0 = <&pwm' $f
          grep -n 'cooling-levels' $f
          grep -n 'temperature = <6[0-9]000>\|temperature = <7[0-9]000>\|temperature = <8[0-9]000>' $f

      - name: Install our board files
        working-directory: kwrt/openwrt
        run: |
          set -x
          BF=target/linux/mediatek/filogic/base-files
          SRC="${GITHUB_WORKSPACE}/overlay-src/files"
          install -D -m 0755 "$SRC/uci-defaults/99-tr3600-defaults" \
            "$BF/etc/uci-defaults/99-tr3600-defaults"
          install -D -m 0755 "$SRC/hotplug.d/net/25-tr3600-usb-tether" \
            "$BF/etc/hotplug.d/net/25-tr3600-usb-tether"
          ls -l "$BF/etc/uci-defaults/" "$BF/etc/hotplug.d/net/"

      - name: Defconfig
        working-directory: kwrt/openwrt
        run: |
          make defconfig
          if [[ ! "${TARGET}" =~ (amlogic_meson8b|armsr_armv8|bcm27xx_*|rockchip_armv8|sunxi_*|x86_*|siflower_*) ]]; then
            sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
            sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
            make defconfig
          fi
          echo "=== selected device ==="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_cudy_tr3600-v1=' .config
          echo "=== usbnet modules ==="
          grep -E '^CONFIG_PACKAGE_kmod-usb-(net|acm|serial-wwan|serial-option)' .config | sort
          echo "=== all enabled filogic devices (should be only tr3600) ==="
          grep -E '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_.*=y$' .config

      - name: Cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: "false"
          mixkey: ${{ env.TARGET }}
          clean: ${{ contains(env.KRT_ACTION, 'nocache') }}
          prefix: ${{ github.workspace }}/kwrt/openwrt

      - name: Compile the firmware
        working-directory: kwrt/openwrt
        run: |
          shopt -s extglob
          df -hT
          echo -e "$(($(nproc)+1)) thread compile"
          make -j$(($(nproc)+1)) || { log=$(mktemp); make V=s &>$log; } || { tail -80 $log; df -hT; exit 1; }
          rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
          rm -rf staging_dir/toolchain-*/initial
          df -hT

      - name: Organize files
        working-directory: kwrt/openwrt
        continue-on-error: true
        run: |
          cd bin/targets/*/*/
          cp "$GITHUB_WORKSPACE/kwrt/openwrt/.config" "${TARGET}.config" || true
          cp "$GITHUB_WORKSPACE/kwrt/openwrt/build_dir/target-*/linux-*/linux-*/.config" "${TARGET}_kernel.config" || true
          ls -la

      - name: Upload firmware
        uses: actions/upload-artifact@main
        with:
          name: kwrt-${{ env.TARGET }}-cudy_tr3600-v1
          if-no-files-found: error
          retention-days: 30
          path: |
            kwrt/openwrt/bin/targets/mediatek/filogic/*tr3600*
            kwrt/openwrt/bin/targets/mediatek/filogic/sha256sums
            kwrt/openwrt/bin/targets/mediatek/filogic/profiles.json
            kwrt/openwrt/bin/targets/mediatek/filogic/*.config
            kwrt/openwrt/bin/targets/mediatek/filogic/*_kernel.config

      - name: Upload imagebuilder / initramfs
        if: env.UPLOAD_IB == 'true'
        uses: actions/upload-artifact@main
        with:
          name: kwrt-${{ env.TARGET }}-cudy_tr3600-v1-imagebuilder
          retention-days: 30
          path: |
            kwrt/openwrt/bin/targets/mediatek/filogic/*imagebuilder*
            kwrt/openwrt/bin/targets/mediatek/filogic/*initramfs*

      - name: Summary
        if: always()
        run: |
          {
            echo "### Kwrt / Cudy TR3600 v1"
            echo ""
            echo "- Kwrt ref: \`${KRT_REF}\`"
            echo "- openwrt ref: \`${OWRT_REF}\`"
            echo "- overlay: fan PWM0 + thermal ramp + USB tethering"
            echo ""
            echo '```'
            ls -la kwrt/openwrt/bin/targets/mediatek/filogic/ 2>/dev/null | head -40
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
